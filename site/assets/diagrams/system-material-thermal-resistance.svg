<svg xmlns="http://www.w3.org/2000/svg" width="920" height="450" viewBox="0 0 920 450" role="img" aria-labelledby="title desc">
<title id="title">从表面热负荷到冷却剂温升</title><desc id="desc">一维稳态固体与换热膜的串联热阻示意，教学温差300 K和100 K。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526672"/></marker></defs>
<rect width="920" height="450" rx="14" fill="white"/>
<g font-family="system-ui,-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><text x="38" y="42" font-size="24" fill="#193449" text-anchor="start" font-weight="650">从表面热负荷到冷却剂温升</text><text x="40" y="83" font-size="17" fill="#526672" text-anchor="start" font-weight="400">同一稳态热流穿过固体与冷却膜；温降按各段面热阻分配。</text><rect x="48" y="126" width="160" height="100" rx="10" fill="#f1f7f8" stroke="#067d83" stroke-width="1.5"/><text x="128.0" y="171.0" font-size="17" fill="#193449" text-anchor="middle" font-weight="600">表面热流</text><text x="128.0" y="198.0" font-size="14" fill="#526672" text-anchor="middle" font-weight="400">q″ / W·m⁻²</text><rect x="274" y="126" width="160" height="100" rx="10" fill="#f1f7f8" stroke="#067d83" stroke-width="1.5"/><text x="354.0" y="171.0" font-size="17" fill="#193449" text-anchor="middle" font-weight="600">固体导热</text><text x="354.0" y="198.0" font-size="14" fill="#526672" text-anchor="middle" font-weight="400">d / k</text><rect x="500" y="126" width="160" height="100" rx="10" fill="#f1f7f8" stroke="#bd641f" stroke-width="1.5"/><text x="580.0" y="171.0" font-size="17" fill="#193449" text-anchor="middle" font-weight="600">冷却膜</text><text x="580.0" y="198.0" font-size="14" fill="#526672" text-anchor="middle" font-weight="400">1 / h</text><rect x="726" y="126" width="145" height="100" rx="10" fill="#f1f7f8" stroke="#067d83" stroke-width="1.5"/><text x="798.5" y="171.0" font-size="17" fill="#193449" text-anchor="middle" font-weight="600">冷却剂</text><text x="798.5" y="198.0" font-size="14" fill="#526672" text-anchor="middle" font-weight="400">Tfluid</text><line x1="216" y1="176" x2="264" y2="176" stroke="#526672" stroke-width="2" marker-end="url(#arr)"/><line x1="442" y1="176" x2="490" y2="176" stroke="#526672" stroke-width="2" marker-end="url(#arr)"/><line x1="668" y1="176" x2="716" y2="176" stroke="#526672" stroke-width="2" marker-end="url(#arr)"/><text x="354" y="276" font-size="20" fill="#067d83" text-anchor="middle" font-weight="600">ΔTsolid = q″d/k</text><text x="580" y="276" font-size="20" fill="#bd641f" text-anchor="middle" font-weight="600">ΔTfilm = q″/h</text><text x="48" y="335" font-size="18" fill="#193449" text-anchor="start" font-weight="400">正文稳态算例：10 MW/m² × 3 mm / 100 W/(m·K) = 300 K</text><text x="48" y="372" font-size="18" fill="#193449" text-anchor="start" font-weight="400">膜换热系数 h = 10⁵ W/(m²·K) → 另增温差 100 K</text><text x="48" y="420" font-size="16" fill="#526672" text-anchor="start" font-weight="400">一维、恒物性、无体热源；接触热阻与真实几何需另计。</text></g></svg>