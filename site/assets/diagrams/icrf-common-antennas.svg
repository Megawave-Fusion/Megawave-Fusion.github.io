ct x="541.3333333333334" y="378" width="14" height="75" rx="1" fill="#59aebd" stroke="#348497"/><rect x="563.0" y="378" width="14" height="75" rx="1" fill="#59aebd" stroke="#348497"/><text x="370" y="495" font-size="13" fill="#294f65" text-anchor="start">单元耦合 + 电容 + 终端</text><text x="370" y="519" font-size="13" fill="#294f65" text-anchor="start">输出余功率单独计入</text><text x="690" y="379" font-size="15" fill="#294f65" text-anchor="start">结构图只表示辐射带排列</text><text x="690" y="410" font-size="13" fill="#294f65" text-anchor="start">馈电、回流、屏与磁场须另建</text><text x="690" y="438" font-size="13" fill="#294f65" text-anchor="start">共轭 T 属于电路拓扑</text></g></svg>