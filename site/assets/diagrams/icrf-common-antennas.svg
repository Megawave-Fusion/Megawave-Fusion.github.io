<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" role="img" aria-labelledby="title desc"><title id="title">五类天线模型：从单元到阵列</title><desc id="desc">结构示意，不按比例；带数、馈电网络与等离子体响应分别定义</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="none" stroke="#6d8ea2"/></marker></defs><rect width="1000" height="580" rx="12" fill="#f4f8fb"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="32" y="38" font-size="22" fill="#294f65" text-anchor="start">五类天线模型：从单元到阵列</text><text x="32" y="65" font-size="12" fill="#627d8f" text-anchor="start">结构示意，不按比例；带数、馈电网络与等离子体响应分别定义</text><rect x="30" y="91" width="310" height="217" rx="8" fill="#fff" stroke="#bed0dc"/><text x="45" y="119" font-size="16" fill="#294f65" text-anchor="start">单电流带</text><rect x="65" y="133" width="240" height="100" rx="2" fill="#eef3f7" stroke="#90acbd"/><rect x="178" y="143" width="14" height="75" rx="1" fill="#59aebd" stroke="#348497"/><text x="45" y="260" font-size="13" fill="#294f65" text-anchor="start">馈电 + 短路 + 回流腔</text><text x="45" y="284" font-size="13" fill="#294f65" text-anchor="start">单元阻抗、带边与间隙场</text><rect x="355" y="91" width="310" height="217" rx="8" fill="#fff" stroke="#bed0dc"/><text x="370" y="119" font-size="16" fill="#294f65" text-anchor="start">双电流带</text><rect x="390" y="133" width="240" height="100" rx="2" fill="#eef3f7" stroke="#90acbd"/><rect x="433.0" y="143" width="14" height="75" rx="1" fill="#59aebd" stroke="#348497"/><rect x="563.0" y="143" width="14" height="75" rx="1" fill="#59aebd" stroke="#348497"/><text x="370" y="260" font-size="13" fill="#294f65" text-anchor="start">相位 Δφ 与实际电流</text><text x="370" y="284" font-size="13" fill="#294f65" text-anchor="start">互耦、双向谱与方向性</text><rect x="680" y="91" width="310" height="217" rx="8" fill="#fff" stroke="#bed0dc"/><text x="695" y="119" font-size="16" fill="#294f65" text-anchor="start">三电流带</text><rect x="715" y="133" width="2