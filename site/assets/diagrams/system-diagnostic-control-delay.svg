<svg xmlns="http://www.w3.org/2000/svg" width="920" height="480" viewBox="0 0 920 480" role="img" aria-labelledby="title desc">
<title id="title">相同增益下，延迟消耗相位裕度</title><desc id="desc">测量、反演、控制和执行器的闭环链条，以及正文一阶模型2 ms与8 ms的相位裕度。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526672"/></marker></defs>
<rect width="920" height="480" rx="14" fill="white"/>
<g font-family="system-ui,-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><text x="38" y="42" font-size="24" fill="#193449" text-anchor="start" font-weight="650">相同增益下，延迟消耗相位裕度</text><text x="40" y="83" font-size="17" fill="#526672" text-anchor="start" font-weight="400">端到端延迟相位：−ωτd；采样频率与延迟预算需分别记录。</text><rect x="42" y="132" width="180" height="91" rx="10" fill="#f1f7f8" stroke="#067d83" stroke-width="1.5"/><text x="132.0" y="172.5" font-size="17" fill="#193449" text-anchor="middle" font-weight="600">诊断</text><text x="132.0" y="199.5" font-size="14" fill="#526672" text-anchor="middle" font-weight="400">采样 / 滤波</text><line x1="228" y1="177" x2="255" y2="177" stroke="#526672" stroke-width="2" marker-end="url(#arr)"/><rect x="265" y="132" width="180" height="91" rx="10" fill="#f1f7f8" stroke="#067d83" stroke-width="1.5"/><text x="355.0" y="172.5" font-size="17" fill="#193449" text-anchor="middle" font-weight="600">反演</text><text x="355.0" y="199.5" font-size="14" fill="#526672" text-anchor="middle" font-weight="400">物理量 / 质量标志</text><line x1="451" y1="177" x2="478" y2="177" stroke="#526672" stroke-width="2" marker-end="url(#arr)"/><rect x="488" y="132" width="180" height="91" rx="10" fill="#f1f7f8" stroke="#067d83" stroke-width="1.5"/><text x="578.0" y="172.5" font-size="17" fill="#193449" text-anchor="middle" font-weight="600">控制器</text><text x="578.0" y="199.5" font-size="14" fill="#526672" text-anchor="middle" font-weight="400">计算 / 功率约束</text><line x1="674" y1="177" x2="701" y2="177" stroke="#526672" stroke-width="2" marker-end="url(#arr)"/><rect x="711" y="132" width="180" height="91" rx="10" fill="#f1f7f8" stroke="#067d83" stroke-width="1.5"/><text x="801.0" y="172.5" font-size="17" fill="#193449" text-anchor="middle" font-weight="600">执行器</text><text x="801.0" y="199.5" font-size="14" fill="#526672" text-anchor="middle" font-weight="400">响应 / 饱和</text><polyline fill="none" stroke="#526672" stroke-width="1.6" points="800.00,229.00 800.00,279.00 133.00,279.00 133.00,229.00"/><text x="465" y="269" font-size="16" fill="#526672" text-anchor="middle" font-weight="400">被控等离子体与测量反馈</text><rect x="73" y="322" width="345" height="87" rx="10" fill="#f1f7f8" stroke="#067d83" stroke-width="1.5"/><text x="245.5" y="360.5" font-size="17" fill="#193449" text-anchor="middle" font-weight="600">延迟 2 ms</text><text x="245.5" y="387.5" font-size="14" fill="#526672" text-anchor="middle" font-weight="400">相位裕度 82.3°</text><rect x="499" y="322" width="345" height="87" rx="10" fill="#f1f7f8" stroke="#bd641f" stroke-width="1.5"/><text x="671.5" y="360.5" font-size="17" fill="#193449" text-anchor="middle" font-weight="600">延迟 8 ms</text><text x="671.5" y="387.5" font-size="14" fill="#526672" text-anchor="middle" font-weight="400">相位裕度 15.7°</text><text x="40" y="455" font-size="15" fill="#526672" text-anchor="start" font-weight="400">教学模型：KKc = 4，τp = 20 ms，交越频率 30.82 Hz；仅改变纯延迟。</text></g></svg>