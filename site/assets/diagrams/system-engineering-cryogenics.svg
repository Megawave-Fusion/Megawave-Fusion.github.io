<svg xmlns="http://www.w3.org/2000/svg" width="920" height="480" viewBox="0 0 920 480" role="img" aria-labelledby="title desc">
<title id="title">冷量换算电耗，要同时看温度级</title><desc id="desc">正文多温度级冷量算例的冷端热量、可逆最低输入功率和300 K热汇。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526672"/></marker></defs>
<rect width="920" height="480" rx="14" fill="white"/>
<g font-family="system-ui,-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><text x="38" y="42" font-size="24" fill="#193449" text-anchor="start" font-weight="650">冷量换算电耗，要同时看温度级</text><text x="40" y="82" font-size="17" fill="#526672" text-anchor="start" font-weight="400">热端 300 K；Pmin = Qc(Th/Tc − 1)。图示可逆下限，实际耗电更高。</text><rect x="49" y="127" width="205" height="105" rx="10" fill="#f1f7f8" stroke="#067d83" stroke-width="1.5"/><text x="151.5" y="174.5" font-size="17" fill="#193449" text-anchor="middle" font-weight="600">4.5 K 冷端</text><text x="151.5" y="201.5" font-size="14" fill="#526672" text-anchor="middle" font-weight="400">Qc = 100 W</text><rect x="49" y="287" width="205" height="105" rx="10" fill="#f1f7f8" stroke="#bd641f" stroke-width="1.5"/><text x="151.5" y="334.5" font-size="17" fill="#193449" text-anchor="middle" font-weight="600">80 K 冷端</text><text x="151.5" y="361.5" font-size="14" fill="#526672" text-anchor="middle" font-weight="400">Qc = 1000 W</text><line x1="266" y1="179" x2="355" y2="179" stroke="#067d83" stroke-width="2.3" marker-end="url(#arr)"/><line x1="266" y1="339" x2="355" y2="339" stroke="#bd641f" stroke-width="2.3" marker-end="url(#arr)"/><text x="298" y="163" font-size="15" fill="#067d83" text-anchor="middle" font-weight="400">搬热</text><text x="298" y="323" font-size="15" fill="#bd641f" text-anchor="middle" font-weight="400">搬热</text><rect x="377" y="127" width="228" height="105" rx="10" fill="#f1f7f8" stroke="#067d83" stroke-width="1.5"/><text x="491.0" y="174.5" font-size="17" fill="#193449" text-anchor="middle" font-weight="600">最低输入 6.57 kW</text><text x="491.0" y="201.5" font-size="14" fill="#526672" text-anchor="middle" font-weight="400">4.5 K 级</text><rect x="377" y="287" width="228" height="105" rx="10" fill="#f1f7f8" stroke="#bd641f" stroke-width="1.5"/><text x="491.0" y="334.5" font-size="17" fill="#193449" text-anchor="middle" font-weight="600">最低输入 2.75 kW</text><text x="491.0" y="361.5" font-size="14" fill="#526672" text-anchor="middle" font-weight="400">80 K 级</text><line x1="617" y1="179" x2="683" y2="179" stroke="#526672" stroke-width="2" marker-end="url(#arr)"/><text x="650" y="167" font-size="13" fill="#526672" text-anchor="middle" font-weight="400">6.67 kW</text><line x1="617" y1="339" x2="683" y2="339" stroke="#526672" stroke-width="2" marker-end="url(#arr)"/><text x="650" y="327" font-size="13" fill="#526672" text-anchor="middle" font-weight="400">3.75 kW</text><rect x="703" y="124" width="165" height="270" rx="12" fill="#f4f6f8" stroke="#dce5e9"/><text x="785" y="231" font-size="25" fill="#193449" text-anchor="middle" font-weight="650">300 K</text><text x="785" y="264" font-size="20" fill="#193449" text-anchor="middle" font-weight="400">热汇</text><text x="40" y="453" font-size="16" fill="#526672" text-anchor="start" font-weight="400">两级合计最低输入 9.32 kW；在较高温度截获漏热，可减轻最低温级负担。</text></g></svg>