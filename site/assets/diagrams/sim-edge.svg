<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc"><title id="title">边缘排热与中性粒子回路</title><desc id="desc">平均输运与涨落分开计算；原子过程改变粒子态与功率路径</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="none" stroke="#6c899a"/></marker></defs><rect width="900" height="430" rx="14" fill="#f4f8fb"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" fill="#203b50"><text x="35" y="39" font-size="21" font-weight="600">边缘排热与中性粒子回路</text><text x="35" y="66" fill="#627b8c" font-size="12">平均输运与涨落分开计算；原子过程改变粒子态与功率路径</text><rect x="39.0" y="132" width="180" height="146" rx="9" fill="white" stroke="#c9dce6"/><rect x="39.0" y="132" width="180" height="5" rx="2" fill="#087e95"/><text x="55.0" y="165" font-size="15" font-weight="600">上游输入</text><text x="55.0" y="194" font-size="12" fill="#536f82">P_SOL、粒子通量</text><text x="55.0" y="218" font-size="12" fill="#536f82">磁几何、杂质</text><path d="M224.0 206h24" stroke="#6c899a" fill="none" marker-end="url(#arr)"/><rect x="253.0" y="132" width="180" height="146" rx="9" fill="white" stroke="#c9dce6"/><rect x="253.0" y="132" width="180" height="5" rx="2" fill="#bb477b"/><text x="269.0" y="165" font-size="15" font-weight="600">等离子体</text><text x="269.0" y="194" font-size="12" fill="#536f82">平行 / 横向输运</text><text x="269.0" y="218" font-size="12" fill="#536f82">辐射、复合与电离</text><path d="M438.0 206h24" stroke="#6c899a" fill="none" marker-end="url(#arr)"/><rect x="467.0" y="132" width="180" height="146" rx="9" fill="white" stroke="#c9dce6"/><rect x="467.0" y="132" width="180" height="5" rx="2" fill="#8b6b14"/><text x="483.0" y="165" font-size="15" font-weight="600">中性粒子</text><text x="483.0" y="194" font-size="12" fill="#536f82">回收、荷交换</text><text x="483.0" y="218" font-size="12" fill="#536f82">抽气与壁面边界</text><path d="M652.0 206h24" stroke="#6c899a" fill="none" marker-end="url(#arr)"/><rect x="681.0" y="132" width="180" height="146" rx="9" fill="white" stroke="#c9dce6"/><rect x="681.0" y="132" width="180" height="5" rx="2" fill="#6b67ac"/><text x="697.0" y="165" font-size="15" font-weight="600">靶板观测</text><text x="697.0" y="194" font-size="12" fill="#536f82">热流、粒子流</text><text x="697.0" y="218" font-size="12" fill="#536f82">温度、辐射与脱靶</text><path d="M771.0 285v42H129.0v-42" stroke="#a06f94" stroke-dasharray="6 5" fill="none" marker-end="url(#arr)"/><text x="450" y="351" text-anchor="middle" font-size="12" fill="#8d5d81">更新背景 / 分布，再核对收敛与功率</text><text x="450" y="402" text-anchor="middle" fill="#718999" font-size="11">箭头表示计算数据交接；各模块的模型假设须分别保存</text></g></svg>