<svg xmlns="http://www.w3.org/2000/svg" width="920" height="465" viewBox="0 0 920 465" role="img" aria-labelledby="title desc">
<title id="title">从一条知识结论回查原文和复算</title><desc id="desc">文献身份、所用版本、具体原文位置、假设、复算和结论的追溯链。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526672"/></marker></defs>
<rect width="920" height="465" rx="14" fill="white"/>
<g font-family="system-ui,-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><text x="38" y="42" font-size="24" fill="#193449" text-anchor="start" font-weight="650">从一条知识结论回查原文和复算</text><text x="40" y="82" font-size="17" fill="#526672" text-anchor="start" font-weight="400">摘要页与 PDF 可属于同一文献；身份、版本和实际阅读位置分别保存。</text><rect x="40" y="123" width="247" height="91" rx="10" fill="#f1f7f8" stroke="#067d83" stroke-width="1.5"/><text x="163.5" y="163.5" font-size="17" fill="#193449" text-anchor="middle" font-weight="600">文献身份</text><text x="163.5" y="190.5" font-size="14" fill="#526672" text-anchor="middle" font-weight="400">作者 / 题名 / DOI</text><rect x="339" y="123" width="247" height="91" rx="10" fill="#f1f7f8" stroke="#067d83" stroke-width="1.5"/><text x="462.5" y="163.5" font-size="17" fill="#193449" text-anchor="middle" font-weight="600">所用版本</text><text x="462.5" y="190.5" font-size="14" fill="#526672" text-anchor="middle" font-weight="400">预印本 / 正式版 / 勘误</text><rect x="638" y="123" width="247" height="91" rx="10" fill="#f1f7f8" stroke="#067d83" stroke-width="1.5"/><text x="761.5" y="163.5" font-size="17" fill="#193449" text-anchor="middle" font-weight="600">原文位置</text><text x="761.5" y="190.5" font-size="14" fill="#526672" text-anchor="middle" font-weight="400">章节 / 方程 / 图 / 数据</text><line x1="296" y1="168" x2="327" y2="168" stroke="#526672" stroke-width="2" marker-end="url(#arr)"/><line x1="595" y1="168" x2="626" y2="168" stroke="#526672" stroke-width="2" marker-end="url(#arr)"/><line x1="762" y1="220" x2="762" y2="270" stroke="#526672" stroke-width="2" marker-end="url(#arr)"/><rect x="638" y="281" width="247" height="91" rx="10" fill="#f1f7f8" stroke="#067d83" stroke-width="1.5"/><text x="761.5" y="321.5" font-size="17" fill="#193449" text-anchor="middle" font-weight="600">条件与符号</text><text x="761.5" y="348.5" font-size="14" fill="#526672" text-anchor="middle" font-weight="400">假设 / 单位 / 归一化</text><rect x="339" y="281" width="247" height="91" rx="10" fill="#f1f7f8" stroke="#067d83" stroke-width="1.5"/><text x="462.5" y="321.5" font-size="17" fill="#193449" text-anchor="middle" font-weight="600">独立复算</text><text x="462.5" y="348.5" font-size="14" fill="#526672" text-anchor="middle" font-weight="400">算例 / 守恒 / 收敛</text><rect x="40" y="281" width="247" height="91" rx="10" fill="#f1f7f8" stroke="#067d83" stroke-width="1.5"/><text x="163.5" y="321.5" font-size="17" fill="#193449" text-anchor="middle" font-weight="600">结论与可观测量</text><text x="163.5" y="348.5" font-size="14" fill="#526672" text-anchor="middle" font-weight="400">支持范围 / 未解决项</text><line x1="629" y1="326" x2="598" y2="326" stroke="#526672" stroke-width="2" marker-end="url(#arr)"/><line x1="330" y1="326" x2="299" y2="326" stroke="#526672" stroke-width="2" marker-end="url(#arr)"/><text x="40" y="430" font-size="16" fill="#526672" text-anchor="start" font-weight="400">来源类型、阅读范围、审核状态是三个字段；新访问日期不替换发表日期。</text></g></svg>