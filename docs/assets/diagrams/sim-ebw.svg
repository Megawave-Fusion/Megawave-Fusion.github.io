<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc"><title id="title">O-X-B：转换与热波传播分段检验</title><desc id="desc">冷全波的 O-X 窗口不等于已解析热 EBW 的 X-B 转换及吸收</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="none" stroke="#6c899a"/></marker></defs><rect width="900" height="430" rx="14" fill="#f4f8fb"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" fill="#203b50"><text x="35" y="39" font-size="21" font-weight="600">O-X-B：转换与热波传播分段检验</text><text x="35" y="66" fill="#627b8c" font-size="12">冷全波的 O-X 窗口不等于已解析热 EBW 的 X-B 转换及吸收</text><rect x="39.0" y="132" width="180" height="146" rx="9" fill="white" stroke="#c9dce6"/><rect x="39.0" y="132" width="180" height="5" rx="2" fill="#087e95"/><text x="55.0" y="165" font-size="15" font-weight="600">真空 O 波束</text><text x="55.0" y="194" font-size="12" fill="#536f82">角谱、偏振、束腰</text><text x="55.0" y="218" font-size="12" fill="#536f82">截止层密度与磁场</text><path d="M224.0 206h24" stroke="#6c899a" fill="none" marker-end="url(#arr)"/><rect x="253.0" y="132" width="180" height="146" rx="9" fill="white" stroke="#c9dce6"/><rect x="253.0" y="132" width="180" height="5" rx="2" fill="#bb477b"/><text x="269.0" y="165" font-size="15" font-weight="600">O-X / X-B</text><text x="269.0" y="194" font-size="12" fill="#536f82">反射与转换能流</text><text x="269.0" y="218" font-size="12" fill="#536f82">热响应、FLR 与短波</text><path d="M438.0 206h24" stroke="#6c899a" fill="none" marker-end="url(#arr)"/><rect x="467.0" y="132" width="180" height="146" rx="9" fill="white" stroke="#c9dce6"/><rect x="467.0" y="132" width="180" height="5" rx="2" fill="#8b6b14"/><text x="483.0" y="165" font-size="15" font-weight="600">EBW 传播</text><text x="483.0" y="194" font-size="12" fill="#536f82">GENRAY / AMR</text><text x="483.0" y="218" font-size="12" fill="#536f82">热色散、谐波吸收</text><path d="M652.0 206h24" stroke="#6c899a" fill="none" marker-end="url(#arr)"/><rect x="681.0" y="132" width="180" height="146" rx="9" fill="white" stroke="#c9dce6"/><rect x="681.0" y="132" width="180" height="5" rx="2" fill="#6b67ac"/><text x="697.0" y="165" font-size="15" font-weight="600">分布与电流</text><text x="697.0" y="194" font-size="12" fill="#536f82">CQL3D / LUKE</text><text x="697.0" y="218" font-size="12" fill="#536f82">准线性与有符号电流</text><path d="M771.0 285v42H129.0v-42" stroke="#a06f94" stroke-dasharray="6 5" fill="none" marker-end="url(#arr)"/><text x="450" y="351" text-anchor="middle" font-size="12" fill="#8d5d81">更新背景 / 分布，再核对收敛与功率</text><text x="450" y="402" text-anchor="middle" fill="#718999" font-size="11">箭头表示计算数据交接；各模块的模型假设须分别保存</text></g></svg>