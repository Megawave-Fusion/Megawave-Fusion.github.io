<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc"><title id="title">几何、密度剖面与开放边界</title><desc id="desc">计算域层次示意，不是特定放电的空间尺寸或有限元网格</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="none" stroke="#6d8ea2"/></marker></defs><rect width="1000" height="520" rx="12" fill="#f4f8fb"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="32" y="38" font-size="22" fill="#294f65" text-anchor="start">几何、密度剖面与开放边界</text><text x="32" y="65" font-size="12" fill="#627d8f" text-anchor="start">计算域层次示意，不是特定放电的空间尺寸或有限元网格</text><rect x="30" y="150" width="170" height="170" rx="0" fill="#e6edf3" stroke="#a8bdcc"/><text x="115.0" y="209" font-size="14" fill="#294f65" text-anchor="middle">天线 / 真空腔</text><text x="115.0" y="242" font-size="12" fill="#294f65" text-anchor="middle">端口、带与回流</text><rect x="200" y="150" width="70" height="170" rx="0" fill="#d5e4ed" stroke="#a8bdcc"/><text x="235.0" y="209" font-size="14" fill="#294f65" text-anchor="middle">屏</text><rect x="270" y="150" width="185" height="170" rx="0" fill="#d9eff1" stroke="#a8bdcc"/><text x="362.5" y="209" font-size="14" fill="#294f65" text-anchor="middle">边缘剖面</text><text x="362.5" y="242" font-size="12" fill="#294f65" text-anchor="middle">密度 / 磁场 / 截止</text><rect x="455" y="150" width="240" height="170" rx="0" fill="#dfebf6" stroke="#a8bdcc"/><text x="575.0" y="209" font-size="14" fill="#294f65" text-anchor="middle">传播区域</text><text x="575.0" y="242" font-size="12" fill="#294f65" text-anchor="middle">波长、极化、净能流</text><rect x="695" y="150" width="195" height="170" rx="0" fill="#ece0f0" stroke="#a8bdcc"/><text x="792.5" y="209" font-size="14" fill="#294f65" text-anchor="middle">ABL 或 PML</text><text x="792.5" y="242" font-size="12" fill="#294f65" text-anchor="middle">按实现分别加密</text><path d="M80 350L914 350" fill="none" stroke="#6d8ea2" stroke-width="2" marker-end="url(#arrow)"/><text x="920" y="355" font-size="14" fill="#294f65" text-anchor="start">x</text><text x="35" y="120" font-size="13" fill="#294f65" text-anchor="start">物理区与数值开放边界分开；示意顺序不代表任意装置固定的截止位置</text><text x="35" y="399" font-size="17" fill="#294f65" text-anchor="start">检查：端口净输入 = 金属损耗 + 物理等离子体耗散 + 出射能流</text><text x="35" y="438" font-size="14" fill="#294f65" text-anchor="start">HFSS 2023 作者实现：等效电导 + ABL；RAPLICASOL：冷张量 + PML。</text><text x="35" y="475" font-size="13" fill="#294f65" text-anchor="start">数值吸收层的耗散代表出域波，不作为核心热吸收的计算结果。</text></g></svg>