<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc"><title id="title">单带最小模型与三层输入</title><desc id="desc">示意图中的馈入只表示电连接；波端口应位于实际建模的均匀同轴截面</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="none" stroke="#6d8ea2"/></marker></defs><rect width="1000" height="520" rx="12" fill="#f4f8fb"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="32" y="38" font-size="22" fill="#294f65" text-anchor="start">单带最小模型与三层输入</text><text x="32" y="65" font-size="12" fill="#627d8f" text-anchor="start">示意图中的馈入只表示电连接；波端口应位于实际建模的均匀同轴截面</text><rect x="35" y="99" width="430" height="315" rx="8" fill="#fff" stroke="#bed0dc"/><text x="55" y="126" font-size="16" fill="#294f65" text-anchor="start">单电流带：局部侧视 / 连接示意</text><rect x="75" y="165" width="205" height="205" rx="1" fill="#e3ebf0" stroke="#66879b"/><rect x="85" y="175" width="195" height="185" rx="0" fill="#fff" stroke="#fff"/><rect x="220" y="206" width="14" height="133" rx="1" fill="#58aaba" stroke="#348497"/><path d="M80 339L226 339" fill="none" stroke="#348497" stroke-width="2"/><path d="M113 207L226 207" fill="none" stroke="#b16383" stroke-width="2"/><path d="M113 150L113 207" fill="none" stroke="#b16383" stroke-width="2"/><text x="95" y="147" font-size="12" fill="#294f65" text-anchor="start">馈入参考面</text><text x="108" y="330" font-size="12" fill="#294f65" text-anchor="start">短路 / 回流</text><text x="167" y="270" font-size="14" fill="#294f65" text-anchor="start">真空腔</text><text x="208" y="190" font-size="12" fill="#294f65" text-anchor="start">带</text><rect x="280" y="180" width="10" height="13" rx="0" fill="#8ca5b2" stroke="#8ca5b2"/><rect x="280" y="203" width="10" height="13" rx="0" fill="#8ca5b2" stroke="#8ca5b2"/><rect x="280" y="226" width="10" height="13" rx="0" fill="#8ca5b2" stroke="#8ca5b2"/><rect x="280" y="249" width="10" height="13" rx="0" fill="#8ca5b2" stroke="#8ca5b2"/><rect x="280" y="272" width="10" height="13" rx="0" fill="#8ca5b2" stroke="#8ca5b2"/><rect x="280" y="295" width="10" height="13" rx="0" fill="#8ca5b2" stroke="#8ca5b2"/><rect x="280" y="318" width="10" height="13" rx="0" fill="#8ca5b2" stroke="#8ca5b2"/><rect x="280" y="341" width="10" height="13" rx="0" fill="#8ca5b2" stroke="#8ca5b2"/><text x="270" y="390" font-size="12" fill="#294f65" text-anchor="start">法拉第屏</text><rect x="328" y="170" width="104" height="185" rx="1" fill="#d5eef0" stroke="#82bdc5"/><text x="340" y="262" font-size="13" fill="#294f65" text-anchor="start">等离子体</text><path d="M295 155L326 155" fill="none" stroke="#6d8ea2" stroke-width="2" marker-end="url(#arrow)"/><text x="300" y="144" font-size="11" fill="#294f65" text-anchor="start">间距</text><path d="M78 395L150 395" fill="none" stroke="#6d8ea2" stroke-width="2" marker-end="url(#arrow)"/><text x="155" y="400" font-size="12" fill="#294f65" text-anchor="start">x →</text><text x="505" y="124" font-size="17" fill="#294f65" text-anchor="start">从几何到结果，保留三个独立输入层</text><rect x="505" y="151" width="456" height="64" rx="8" fill="#fff" stroke="#bed0dc"/><text x="520" y="176" font-size="15" fill="#294f65" text-anchor="start">几何与导体</text><text x="520" y="199" font-size="13" fill="#294f65" text-anchor="start">尺寸、短路、连接、屏、圆角</text><rect x="505" y="234" width="456" height="64" rx="8" fill="#fff" stroke="#bed0dc"/><text x="520" y="259" font-size="15" fill="#294f65" text-anchor="start">等离子体负载</text><text x="520" y="282" font-size="13" fill="#294f65" text-anchor="start">nₑ(x)、B₀、组分、张量与开放边界</text><rect x="505" y="317" width="456" height="64" rx="8" fill="#fff" stroke="#bed0dc"/><text x="520" y="342" font-size="15" fill="#294f65" text-anchor="start">馈电网络</text><text x="520" y="365" font-size="13" fill="#294f65" text-anchor="start">端口模、参考面、阻抗、电容与终端</text><text x="36" y="463" font-size="13" fill="#294f65" text-anchor="start">同一结构先做真空冷测，再加均匀负载与剖面；金属连接决定回流路径。</text></g></svg>