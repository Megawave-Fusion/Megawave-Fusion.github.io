<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc"><title id="title">从磁几何到可验证的预测</title><desc id="desc">计算链示意；不表示每项研究都必须运行全部模块</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="none" stroke="#6c899a"/></marker></defs><rect width="900" height="430" rx="14" fill="#f4f8fb"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" fill="#203b50"><text x="35" y="39" font-size="21" font-weight="600">从磁几何到可验证的预测</text><text x="35" y="66" fill="#627b8c" font-size="12">计算链示意；不表示每项研究都必须运行全部模块</text><rect x="39.0" y="132" width="180" height="146" rx="9" fill="white" stroke="#c9dce6"/><rect x="39.0" y="132" width="180" height="5" rx="2" fill="#087e95"/><text x="55.0" y="165" font-size="15" font-weight="600">几何与背景</text><text x="55.0" y="194" font-size="12" fill="#536f82">平衡 / 磁场</text><text x="55.0" y="218" font-size="12" fill="#536f82">密度、温度、组分</text><path d="M224.0 206h24" stroke="#6c899a" fill="none" marker-end="url(#arr)"/><rect x="253.0" y="132" width="180" height="146" rx="9" fill="white" stroke="#c9dce6"/><rect x="253.0" y="132" width="180" height="5" rx="2" fill="#bb477b"/><text x="269.0" y="165" font-size="15" font-weight="600">源与分布</text><text x="269.0" y="194" font-size="12" fill="#536f82">波吸收 / 束出生</text><text x="269.0" y="218" font-size="12" fill="#536f82">碰撞、扩散、轨道</text><path d="M438.0 206h24" stroke="#6c899a" fill="none" marker-end="url(#arr)"/><rect x="467.0" y="132" width="180" height="146" rx="9" fill="white" stroke="#c9dce6"/><rect x="467.0" y="132" width="180" height="5" rx="2" fill="#8b6b14"/><text x="483.0" y="165" font-size="15" font-weight="600">输运与负荷</text><text x="483.0" y="194" font-size="12" fill="#536f82">热 / 粒子 / 电流</text><text x="483.0" y="218" font-size="12" fill="#536f82">边缘、核热与壁面</text><path d="M652.0 206h24" stroke="#6c899a" fill="none" marker-end="url(#arr)"/><rect x="681.0" y="132" width="180" height="146" rx="9" fill="white" stroke="#c9dce6"/><rect x="681.0" y="132" width="180" height="5" rx="2" fill="#6b67ac"/><text x="697.0" y="165" font-size="15" font-weight="600">对照与复算</text><text x="697.0" y="194" font-size="12" fill="#536f82">守恒 / 收敛 / 误差</text><text x="697.0" y="218" font-size="12" fill="#536f82">实验前向诊断</text><path d="M771.0 285v42H129.0v-42" stroke="#a06f94" stroke-dasharray="6 5" fill="none" marker-end="url(#arr)"/><text x="450" y="351" text-anchor="middle" font-size="12" fill="#8d5d81">更新背景 / 分布，再核对收敛与功率</text><text x="450" y="402" text-anchor="middle" fill="#718999" font-size="11">箭头表示计算数据交接；各模块的模型假设须分别保存</text></g></svg>