<svg xmlns="http://www.w3.org/2000/svg" width="920" height="465" viewBox="0 0 920 465" role="img" aria-labelledby="title desc">
<title id="title">部件成熟度由对应环境的证据支持</title><desc id="desc">实验室样件、相关环境部件和集成原型的证据链。基于正文NASA TRL 4至6阅读示例，不把它用作聚变整机评级。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526672"/></marker></defs>
<rect width="920" height="465" rx="14" fill="white"/>
<g font-family="system-ui,-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><text x="38" y="42" font-size="24" fill="#193449" text-anchor="start" font-weight="650">部件成熟度由对应环境的证据支持</text><text x="40" y="82" font-size="17" fill="#526672" text-anchor="start" font-weight="400">以同一部件为对象；每一步记录环境、尺度、接口与未覆盖工况。</text><rect x="40" y="126" width="247" height="104" rx="10" fill="#f1f7f8" stroke="#067d83" stroke-width="1.5"/><text x="163.5" y="173.0" font-size="17" fill="#193449" text-anchor="middle" font-weight="600">实验室样件</text><text x="163.5" y="200.0" font-size="14" fill="#526672" text-anchor="middle" font-weight="400">功能与重复性</text><line x1="296" y1="178" x2="327" y2="178" stroke="#526672" stroke-width="2" marker-end="url(#arr)"/><rect x="339" y="126" width="247" height="104" rx="10" fill="#f1f7f8" stroke="#067d83" stroke-width="1.5"/><text x="462.5" y="173.0" font-size="17" fill="#193449" text-anchor="middle" font-weight="600">相关环境部件</text><text x="462.5" y="200.0" font-size="14" fill="#526672" text-anchor="middle" font-weight="400">温度 / 压力 / 热负载</text><line x1="595" y1="178" x2="626" y2="178" stroke="#526672" stroke-width="2" marker-end="url(#arr)"/><rect x="638" y="126" width="247" height="104" rx="10" fill="#f1f7f8" stroke="#067d83" stroke-width="1.5"/><text x="761.5" y="173.0" font-size="17" fill="#193449" text-anchor="middle" font-weight="600">集成子系统原型</text><text x="761.5" y="200.0" font-size="14" fill="#526672" text-anchor="middle" font-weight="400">尺度 / 接口 / 支持系统</text><text x="40" y="273" font-size="18" fill="#193449" text-anchor="start" font-weight="600">每份试验报告都要能回答</text><rect x="40" y="294" width="247" height="88" rx="10" fill="#f1f7f8" stroke="#067d83" stroke-width="1.5"/><text x="163.5" y="333.0" font-size="17" fill="#193449" text-anchor="middle" font-weight="600">对象与版本</text><text x="163.5" y="360.0" font-size="14" fill="#526672" text-anchor="middle" font-weight="400">试件 / 图纸 / 炉批</text><rect x="339" y="294" width="247" height="88" rx="10" fill="#f1f7f8" stroke="#067d83" stroke-width="1.5"/><text x="462.5" y="333.0" font-size="17" fill="#193449" text-anchor="middle" font-weight="600">负载与计量</text><text x="462.5" y="360.0" font-size="14" fill="#526672" text-anchor="middle" font-weight="400">工况 / 单位 / 测量面</text><rect x="638" y="294" width="247" height="88" rx="10" fill="#f1f7f8" stroke="#067d83" stroke-width="1.5"/><text x="761.5" y="333.0" font-size="17" fill="#193449" text-anchor="middle" font-weight="600">结果与范围</text><text x="761.5" y="360.0" font-size="14" fill="#526672" text-anchor="middle" font-weight="400">误差 / 失效 / 退出证据</text><text x="40" y="433" font-size="16" fill="#526672" text-anchor="start" font-weight="400">技术性能证据与专利地域、法律状态分别核查，再关联到同一部件档案。</text></g></svg>