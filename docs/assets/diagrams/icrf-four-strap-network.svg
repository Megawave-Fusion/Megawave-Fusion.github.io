<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc"><title id="title">四带几何与共轭 T：两种描述层次</title><desc id="desc">按 WEST 的 2 环向 × 2 极向布局示意；支路不是单个裸 strap 的输入阻抗</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="none" stroke="#6d8ea2"/></marker></defs><rect width="1000" height="520" rx="12" fill="#f4f8fb"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="32" y="38" font-size="22" fill="#294f65" text-anchor="start">四带几何与共轭 T：两种描述层次</text><text x="32" y="65" font-size="12" fill="#627d8f" text-anchor="start">按 WEST 的 2 环向 × 2 极向布局示意；支路不是单个裸 strap 的输入阻抗</text><text x="140" y="114" font-size="16" fill="#294f65" text-anchor="start">左侧</text><rect x="140" y="144" width="160" height="82" rx="8" fill="#fff" stroke="#bed0dc"/><rect x="140" y="257" width="160" height="82" rx="8" fill="#fff" stroke="#bed0dc"/><text x="165" y="179" font-size="13" fill="#294f65" text-anchor="start">上带 + 串联电容</text><text x="165" y="204" font-size="12" fill="#294f65" text-anchor="start">等效支路 Z₁</text><text x="165" y="292" font-size="13" fill="#294f65" text-anchor="start">下带 + 串联电容</text><text x="165" y="317" font-size="12" fill="#294f65" text-anchor="start">等效支路 Z₂</text><path d="M90 187L140 187" fill="none" stroke="#6d8ea2" stroke-width="2"/><path d="M90 300L140 300" fill="none" stroke="#6d8ea2" stroke-width="2"/><path d="M90 187L90 300" fill="none" stroke="#6d8ea2" stroke-width="2"/><path d="M45 244L90 244" fill="none" stroke="#6d8ea2" stroke-width="2" marker-end="url(#arrow)"/><text x="50" y="230" font-size="14" fill="#294f65" text-anchor="start">T</text><text x="630" y="114" font-size="16" fill="#294f65" text-anchor="start">右侧</text><rect x="630" y="144" width="160" height="82" rx="8" fill="#fff" stroke="#bed0dc"/><rect x="630" y="257" width="160" height="82" rx="8" fill="#fff" stroke="#bed0dc"/><text x="655" y="179" font-size="13" fill="#294f65" text-anchor="start">上带 + 串联电容</text><text x="655" y="204" font-size="12" fill="#294f65" text-anchor="start">等效支路 Z₁</text><text x="655" y="292" font-size="13" fill="#294f65" text-anchor="start">下带 + 串联电容</text><text x="655" y="317" font-size="12" fill="#294f65" text-anchor="start">等效支路 Z₂</text><path d="M580 187L630 187" fill="none" stroke="#6d8ea2" stroke-width="2"/><path d="M580 300L630 300" fill="none" stroke="#6d8ea2" stroke-width="2"/><path d="M580 187L580 300" fill="none" stroke="#6d8ea2" stroke-width="2"/><path d="M535 244L580 244" fill="none" stroke="#6d8ea2" stroke-width="2" marker-end="url(#arrow)"/><text x="540" y="230" font-size="14" fill="#294f65" text-anchor="start">T</text><path d="M312 186L614 186" fill="none" stroke="#6d8ea2" stroke-width="2" stroke-dasharray="7 5"/><path d="M312 298L614 298" fill="none" stroke="#6d8ea2" stroke-width="2" stroke-dasharray="7 5"/><text x="406" y="216" font-size="14" fill="#294f65" text-anchor="start">四端口面保留互耦</text><text x="375" y="265" font-size="13" fill="#294f65" text-anchor="start">电磁响应 + 外部电容/馈线</text><text x="50" y="399" font-size="17" fill="#294f65" text-anchor="start">教学独立双支路：Z₁=R+iX，Z₂=R−iX ⇒ Z_T=(R²+X²)/(2R)</text><text x="50" y="435" font-size="13" fill="#294f65" text-anchor="start">真实带间耦合并未画成独立电阻；需连接完整 S/Z 矩阵计算。</text></g></svg>