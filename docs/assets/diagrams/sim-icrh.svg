<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc"><title id="title">ICRH：天线、热波、快尾与热化</title><desc id="desc">直接 RF 吸收与随后碰撞给背景的热化功率分别记账</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="none" stroke="#6c899a"/></marker></defs><rect width="900" height="430" rx="14" fill="#f4f8fb"/><g font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" fill="#203b50"><text x="35" y="39" font-size="21" font-weight="600">ICRH：天线、热波、快尾与热化</text><text x="35" y="66" fill="#627b8c" font-size="12">直接 RF 吸收与随后碰撞给背景的热化功率分别记账</text><rect x="39.0" y="132" width="180" height="146" rx="9" fill="white" stroke="#c9dce6"/><rect x="39.0" y="132" width="180" height="5" rx="2" fill="#087e95"/><text x="55.0" y="165" font-size="15" font-weight="600">端口与天线</text><text x="55.0" y="194" font-size="12" fill="#536f82">TOPICA / RAPLICASOL</text><text x="55.0" y="218" font-size="12" fill="#536f82">电流谱、S/Z 与负载</text><path d="M224.0 206h24" stroke="#6c899a" fill="none" marker-end="url(#arr)"/><rect x="253.0" y="132" width="180" height="146" rx="9" fill="white" stroke="#c9dce6"/><rect x="253.0" y="132" width="180" height="5" rx="2" fill="#bb477b"/><text x="269.0" y="165" font-size="15" font-weight="600">热全波</text><text x="269.0" y="194" font-size="12" fill="#536f82">TORIC / AORSA</text><text x="269.0" y="218" font-size="12" fill="#536f82">组分吸收与模转换</text><path d="M438.0 206h24" stroke="#6c899a" fill="none" marker-end="url(#arr)"/><rect x="467.0" y="132" width="180" height="146" rx="9" fill="white" stroke="#c9dce6"/><rect x="467.0" y="132" width="180" height="5" rx="2" fill="#8b6b14"/><text x="483.0" y="165" font-size="15" font-weight="600">分布与轨道</text><text x="483.0" y="194" font-size="12" fill="#536f82">CQL3D / ORBIT-RF</text><text x="483.0" y="218" font-size="12" fill="#536f82">快尾、轨道及损失</text><path d="M652.0 206h24" stroke="#6c899a" fill="none" marker-end="url(#arr)"/>